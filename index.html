<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Clarity | Task Manager</title>
    <!-- Google Fonts + Simple Icons (Font Awesome) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #F1F4F9;
            font-family: 'Inter', sans-serif;
            color: #1A2C3E;
            line-height: 1.4;
            padding: 2rem 1.5rem;
        }

        /* main container */
        .app-container {
            max-width: 1280px;
            margin: 0 auto;
            background: #FFFFFF;
            border-radius: 2rem;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.05), 0 4px 8px rgba(0, 0, 0, 0.02);
            overflow: hidden;
            transition: all 0.2s ease;
        }

        /* header area */
        .header {
            padding: 2rem 2rem 1rem 2rem;
            border-bottom: 1px solid #EAEFF4;
        }

        .header h1 {
            font-size: 1.9rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #2C3E50 0%, #3A5A70 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-block;
        }

        .header p {
            color: #5C6F87;
            font-size: 0.9rem;
            margin-top: 0.5rem;
            font-weight: 400;
        }

        /* stats & progress */
        .stats-area {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-top: 1.5rem;
            gap: 1.5rem;
        }

        .stats-cards {
            display: flex;
            gap: 1.2rem;
        }

        .stat-card {
            background: #F8FAFE;
            border-radius: 1.2rem;
            padding: 0.7rem 1.2rem;
            min-width: 100px;
            text-align: center;
            border: 1px solid #E9EFF5;
        }

        .stat-number {
            font-size: 1.8rem;
            font-weight: 700;
            color: #2C4C6C;
            line-height: 1.2;
        }

        .stat-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 500;
            color: #6F8FAC;
        }

        .progress-section {
            flex: 1;
            min-width: 160px;
        }

        .progress-label {
            font-size: 0.75rem;
            font-weight: 500;
            color: #4F6F8F;
            margin-bottom: 0.4rem;
            display: flex;
            justify-content: space-between;
        }

        .progress-bar-bg {
            background: #E2E9F2;
            border-radius: 100px;
            height: 8px;
            overflow: hidden;
        }

        .progress-fill {
            background: #5282A3;
            width: 0%;
            height: 100%;
            border-radius: 100px;
            transition: width 0.25s ease;
        }

        /* add task form */
        .add-task-section {
            padding: 1.5rem 2rem;
            background: #FDFEFF;
            border-bottom: 1px solid #EAEFF4;
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: flex-end;
        }

        .input-group {
            flex: 1;
            min-width: 140px;
        }

        .input-group label {
            font-size: 0.7rem;
            font-weight: 500;
            text-transform: uppercase;
            color: #6C86A0;
            letter-spacing: 0.3px;
            display: block;
            margin-bottom: 0.3rem;
        }

        .input-group input, .input-group select, .input-group textarea {
            width: 100%;
            border: 1px solid #DDE4EC;
            border-radius: 0.9rem;
            padding: 0.7rem 1rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            background: #FFFFFF;
            transition: all 0.2s;
            color: #1A2C3E;
        }

        .input-group input:focus, .input-group select:focus, .input-group textarea:focus {
            outline: none;
            border-color: #8AADC8;
            box-shadow: 0 0 0 3px rgba(90, 130, 160, 0.15);
        }

        .btn-primary {
            background: #2F4F6F;
            border: none;
            padding: 0.7rem 1.4rem;
            border-radius: 1.8rem;
            font-weight: 500;
            font-size: 0.85rem;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-family: 'Inter', sans-serif;
        }

        .btn-primary:hover {
            background: #1F3F5F;
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }

        /* filters & actions */
        .filter-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            padding: 1rem 2rem;
            background: #FCFDFF;
            border-bottom: 1px solid #EEF2F8;
        }

        .filters {
            display: flex;
            gap: 0.6rem;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid #DCE5ED;
            padding: 0.4rem 1.1rem;
            border-radius: 2rem;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            color: #456077;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background: #2F4F6F;
            border-color: #2F4F6F;
            color: white;
        }

        .clear-completed {
            background: transparent;
            border: 1px solid #DCE5ED;
            padding: 0.4rem 1rem;
            border-radius: 2rem;
            font-size: 0.8rem;
            font-weight: 500;
            color: #8A6E6E;
            cursor: pointer;
            transition: 0.2s;
        }

        .clear-completed:hover {
            background: #FEF2F0;
            border-color: #CBA5A5;
            color: #A15C5C;
        }

        /* tasks list */
        .tasks-container {
            padding: 1.8rem 2rem 2rem 2rem;
            min-height: 380px;
        }

        .task-item {
            background: #FFFFFF;
            border: 1px solid #EAEFF4;
            border-radius: 1.2rem;
            padding: 1rem 1.2rem;
            margin-bottom: 0.9rem;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }

        .task-item:hover {
            border-color: #CCD8E4;
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.03);
        }

        .task-main-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .task-check {
            display: flex;
            align-items: center;
        }

        .task-check input {
            width: 1.2rem;
            height: 1.2rem;
            cursor: pointer;
            accent-color: #5382A3;
        }

        .task-title {
            flex: 1;
            font-weight: 600;
            font-size: 1rem;
            color: #1C3C54;
            word-break: break-word;
        }

        .completed-task .task-title {
            text-decoration: line-through;
            color: #9AADBE;
        }

        .task-badge {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            flex-wrap: wrap;
        }

        .priority {
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.2rem 0.7rem;
            border-radius: 50px;
            background: #F0F3F8;
            color: #4C6A86;
        }

        .priority.low { background: #EAF3EC; color: #3B6A4E; }
        .priority.medium { background: #FEF4E8; color: #BA7E3A; }
        .priority.high { background: #FEF0EE; color: #B45A5A; }

        .due-date {
            font-size: 0.7rem;
            background: #F6F9FD;
            padding: 0.2rem 0.6rem;
            border-radius: 30px;
            color: #577694;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .task-actions {
            display: flex;
            gap: 0.6rem;
            align-items: center;
        }

        .task-actions button {
            background: transparent;
            border: none;
            font-size: 0.9rem;
            cursor: pointer;
            color: #8FA2B5;
            transition: 0.15s;
            padding: 0.2rem;
        }

        .task-actions button:hover {
            color: #2F4F6F;
        }

        .task-description {
            margin-top: 0.65rem;
            margin-left: 2rem;
            font-size: 0.75rem;
            color: #6F8EAA;
            border-left: 2px solid #E2EAF2;
            padding-left: 0.8rem;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #879FB2;
            font-size: 0.9rem;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(30, 40, 50, 0.6);
            backdrop-filter: blur(2px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: #FFFFFF;
            border-radius: 1.8rem;
            width: 90%;
            max-width: 480px;
            padding: 1.8rem;
            box-shadow: 0 25px 35px -12px rgba(0,0,0,0.2);
            animation: fadeUp 0.2s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(15px);}
            to { opacity: 1; transform: translateY(0);}
        }

        .modal-content h3 {
            font-weight: 600;
            margin-bottom: 1.2rem;
            color: #1E3A4D;
        }

        .modal-input-group {
            margin-bottom: 1rem;
        }

        .modal-input-group label {
            font-size: 0.7rem;
            font-weight: 600;
            display: block;
            margin-bottom: 0.2rem;
            color: #6C86A0;
        }

        .modal-input-group input, .modal-input-group select, .modal-input-group textarea {
            width: 100%;
            border: 1px solid #DDE4EC;
            border-radius: 0.9rem;
            padding: 0.65rem 1rem;
            font-family: 'Inter', sans-serif;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 0.8rem;
            margin-top: 1.4rem;
        }

        .modal-buttons button {
            padding: 0.5rem 1.2rem;
            border-radius: 2rem;
            border: none;
            cursor: pointer;
            font-weight: 500;
        }

        .btn-save {
            background: #2F4F6F;
            color: white;
        }

        .btn-cancel {
            background: #EDF2F7;
            color: #456077;
        }

        @media (max-width: 700px) {
            body { padding: 1rem; }
            .form-row { flex-direction: column; align-items: stretch; }
            .stats-area { flex-direction: column; align-items: flex-start; }
            .filter-bar { flex-direction: column; align-items: stretch; }
            .filters { justify-content: center; }
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header">
        <h1><i class="fas fa-check-circle" style="font-size: 1.7rem; color: #5382A3; margin-right: 8px;"></i> Clarity</h1>
        <p>Organize tasks with intent · clean, focused, professional</p>
        <div class="stats-area">
            <div class="stats-cards">
                <div class="stat-card"><div class="stat-number" id="totalTasks">0</div><div class="stat-label">Total</div></div>
                <div class="stat-card"><div class="stat-number" id="activeTasks">0</div><div class="stat-label">Active</div></div>
                <div class="stat-card"><div class="stat-number" id="completedTasks">0</div><div class="stat-label">Done</div></div>
            </div>
            <div class="progress-section">
                <div class="progress-label"><span>Completion</span><span id="progressPercent">0%</span></div>
                <div class="progress-bar-bg"><div class="progress-fill" id="progressFill"></div></div>
            </div>
        </div>
    </div>

    <div class="add-task-section">
        <div class="form-row">
            <div class="input-group" style="flex: 2;">
                <label>Task title *</label>
                <input type="text" id="taskTitleInput" placeholder="Design new dashboard, review wireframes..." autocomplete="off">
            </div>
            <div class="input-group">
                <label>Description (optional)</label>
                <input type="text" id="taskDescInput" placeholder="Add notes...">
            </div>
            <div class="input-group">
                <label>Due date</label>
                <input type="date" id="taskDueInput">
            </div>
            <div class="input-group">
                <label>Priority</label>
                <select id="taskPriorityInput">
                    <option value="low">Low</option>
                    <option value="medium" selected>Medium</option>
                    <option value="high">High</option>
                </select>
            </div>
            <div>
                <button class="btn-primary" id="addTaskBtn"><i class="fas fa-plus"></i> Add task</button>
            </div>
        </div>
    </div>

    <div class="filter-bar">
        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>
        <button class="clear-completed" id="clearCompletedBtn"><i class="fas fa-trash-alt"></i> Clear completed</button>
    </div>

    <div class="tasks-container" id="tasksList">
        <!-- dynamic task cards will appear here -->
        <div class="empty-state"><i class="fas fa-clipboard-list" style="margin-right: 6px;"></i> No tasks yet. Add your first task above.</div>
    </div>
</div>

<!-- Edit Modal -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <h3><i class="fas fa-pen-alt" style="margin-right: 8px;"></i> Edit task</h3>
        <div class="modal-input-group">
            <label>Title</label>
            <input type="text" id="editTitle" placeholder="Task title">
        </div>
        <div class="modal-input-group">
            <label>Description</label>
            <input type="text" id="editDesc" placeholder="Description">
        </div>
        <div class="modal-input-group">
            <label>Due date</label>
            <input type="date" id="editDue">
        </div>
        <div class="modal-input-group">
            <label>Priority</label>
            <select id="editPriority">
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
            </select>
        </div>
        <div class="modal-buttons">
            <button class="btn-cancel" id="closeModalBtn">Cancel</button>
            <button class="btn-save" id="saveEditBtn">Save changes</button>
        </div>
    </div>
</div>

<script>
    // ---------- TASK MANAGER CORE ----------
    let tasks = [];
    let currentFilter = "all";
    let editingTaskId = null;

    // DOM elements
    const tasksContainer = document.getElementById("tasksList");
    const totalSpan = document.getElementById("totalTasks");
    const activeSpan = document.getElementById("activeTasks");
    const completedSpan = document.getElementById("completedTasks");
    const progressPercentSpan = document.getElementById("progressPercent");
    const progressFillDiv = document.getElementById("progressFill");
    const addBtn = document.getElementById("addTaskBtn");
    const clearCompletedBtn = document.getElementById("clearCompletedBtn");
    const filterBtns = document.querySelectorAll(".filter-btn");
    const modal = document.getElementById("editModal");
    const editTitle = document.getElementById("editTitle");
    const editDesc = document.getElementById("editDesc");
    const editDue = document.getElementById("editDue");
    const editPriority = document.getElementById("editPriority");
    const closeModalBtn = document.getElementById("closeModalBtn");
    const saveEditBtn = document.getElementById("saveEditBtn");

    // Helper: load from localStorage
    function loadTasks() {
        const stored = localStorage.getItem("clarity_tasks");
        if (stored) {
            tasks = JSON.parse(stored);
        } else {
            // Seed sample tasks for beautiful demo (portfolio ready)
            tasks = [
                {
                    id: Date.now() + 101,
                    title: "Review portfolio case study",
                    description: "Refine interactions and add srcset images",
                    dueDate: new Date(Date.now() + 86400000 * 3).toISOString().split('T')[0],
                    priority: "medium",
                    completed: false,
                    createdAt: Date.now()
                },
                {
                    id: Date.now() + 102,
                    title: "Update design system documentation",
                    description: "Document tokens and usage guidelines",
                    dueDate: new Date(Date.now() + 86400000).toISOString().split('T')[0],
                    priority: "high",
                    completed: false,
                    createdAt: Date.now() - 10000
                },
                {
                    id: Date.now() + 103,
                    title: "Weekly sync with team",
                    description: "Prepare agenda for monday meeting",
                    dueDate: new Date(Date.now() + 86400000 * 2).toISOString().split('T')[0],
                    priority: "low",
                    completed: true,
                    createdAt: Date.now() - 50000
                }
            ];
            saveTasks();
        }
        renderAll();
    }

    function saveTasks() {
        localStorage.setItem("clarity_tasks", JSON.stringify(tasks));
    }

    // CRUD operations
    function addTask(title, description, dueDate, priority) {
        if (!title.trim()) {
            alert("Task title is required");
            return false;
        }
        const newTask = {
            id: Date.now(),
            title: title.trim(),
            description: description?.trim() || "",
            dueDate: dueDate || "",
            priority: priority,
            completed: false,
            createdAt: Date.now()
        };
        tasks.unshift(newTask); // newest first
        saveTasks();
        renderAll();
        return true;
    }

    function deleteTask(id) {
        if (confirm("Delete this task permanently?")) {
            tasks = tasks.filter(t => t.id !== id);
            saveTasks();
            renderAll();
        }
    }

    function toggleComplete(id) {
        const task = tasks.find(t => t.id === id);
        if (task) {
            task.completed = !task.completed;
            saveTasks();
            renderAll();
        }
    }

    function updateTask(id, updatedData) {
        const index = tasks.findIndex(t => t.id === id);
        if (index !== -1) {
            tasks[index] = { ...tasks[index], ...updatedData };
            saveTasks();
            renderAll();
        }
    }

    function clearCompleted() {
        if (tasks.some(t => t.completed)) {
            if (confirm("Remove all completed tasks?")) {
                tasks = tasks.filter(t => !t.completed);
                saveTasks();
                renderAll();
            }
        }
    }

    // Filter tasks
    function getFilteredTasks() {
        if (currentFilter === "active") return tasks.filter(t => !t.completed);
        if (currentFilter === "completed") return tasks.filter(t => t.completed);
        return tasks;
    }

    // Update stats & progress
    function updateStats() {
        const total = tasks.length;
        const completedCount = tasks.filter(t => t.completed).length;
        const activeCount = total - completedCount;
        totalSpan.innerText = total;
        activeSpan.innerText = activeCount;
        completedSpan.innerText = completedCount;
        const percent = total === 0 ? 0 : Math.round((completedCount / total) * 100);
        progressPercentSpan.innerText = `${percent}%`;
        progressFillDiv.style.width = `${percent}%`;
    }

    // Render task list
    function renderTasks() {
        const filtered = getFilteredTasks();
        if (filtered.length === 0) {
            tasksContainer.innerHTML = `<div class="empty-state"><i class="fas fa-inbox"></i> No tasks here · Add a new one</div>`;
            return;
        }

        const tasksHTML = filtered.map(task => {
            const priorityClass = task.priority === 'low' ? 'low' : (task.priority === 'medium' ? 'medium' : 'high');
            const priorityLabel = task.priority === 'low' ? 'Low' : (task.priority === 'medium' ? 'Medium' : 'High');
            const dueDateFormatted = task.dueDate ? `<span class="due-date"><i class="far fa-calendar-alt"></i> ${task.dueDate}</span>` : '';
            const descriptionHtml = task.description ? `<div class="task-description"><i class="far fa-note-sticky" style="margin-right: 4px;"></i> ${escapeHtml(task.description)}</div>` : '';
            const completedClass = task.completed ? 'completed-task' : '';
            
            return `
                <div class="task-item ${completedClass}" data-task-id="${task.id}">
                    <div class="task-main-row">
                        <div class="task-check">
                            <input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''} data-id="${task.id}">
                        </div>
                        <div class="task-title">${escapeHtml(task.title)}</div>
                        <div class="task-badge">
                            <span class="priority ${priorityClass}">${priorityLabel}</span>
                            ${dueDateFormatted}
                        </div>
                        <div class="task-actions">
                            <button class="edit-task" data-id="${task.id}" title="Edit"><i class="fas fa-edit"></i></button>
                            <button class="delete-task" data-id="${task.id}" title="Delete"><i class="fas fa-trash-alt"></i></button>
                        </div>
                    </div>
                    ${descriptionHtml}
                </div>
            `;
        }).join('');
        
        tasksContainer.innerHTML = tasksHTML;
        
        // attach event listeners via delegation (handled in global listener)
        document.querySelectorAll('.task-checkbox').forEach(cb => {
            cb.removeEventListener('change', handleCheckboxChange);
            cb.addEventListener('change', handleCheckboxChange);
        });
        document.querySelectorAll('.edit-task').forEach(btn => {
            btn.removeEventListener('click', handleEditClick);
            btn.addEventListener('click', handleEditClick);
        });
        document.querySelectorAll('.delete-task').forEach(btn => {
            btn.removeEventListener('click', handleDeleteClick);
            btn.addEventListener('click', handleDeleteClick);
        });
    }
    
    function handleCheckboxChange(e) {
        e.stopPropagation();
        const id = parseInt(e.target.getAttribute('data-id'));
        toggleComplete(id);
    }
    
    function handleEditClick(e) {
        const id = parseInt(e.currentTarget.getAttribute('data-id'));
        openEditModal(id);
    }
    
    function handleDeleteClick(e) {
        const id = parseInt(e.currentTarget.getAttribute('data-id'));
        deleteTask(id);
    }
    
    function openEditModal(id) {
        const task = tasks.find(t => t.id === id);
        if (task) {
            editingTaskId = id;
            editTitle.value = task.title;
            editDesc.value = task.description || "";
            editDue.value = task.dueDate || "";
            editPriority.value = task.priority;
            modal.style.display = "flex";
        }
    }
    
    function closeModal() {
        modal.style.display = "none";
        editingTaskId = null;
    }
    
    function saveEdit() {
        if (!editingTaskId) return;
        const newTitle = editTitle.value.trim();
        if (!newTitle) {
            alert("Title cannot be empty");
            return;
        }
        updateTask(editingTaskId, {
            title: newTitle,
            description: editDesc.value.trim(),
            dueDate: editDue.value,
            priority: editPriority.value
        });
        closeModal();
    }
    
    function renderAll() {
        updateStats();
        renderTasks();
    }
    
    // Helper to escape HTML
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }
    
    // Event listeners & init
    function init() {
        loadTasks();
        
        addBtn.addEventListener('click', () => {
            const title = document.getElementById("taskTitleInput").value;
            const desc = document.getElementById("taskDescInput").value;
            const due = document.getElementById("taskDueInput").value;
            const priority = document.getElementById("taskPriorityInput").value;
            if (addTask(title, desc, due, priority)) {
                // clear inputs after success
                document.getElementById("taskTitleInput").value = "";
                document.getElementById("taskDescInput").value = "";
                document.getElementById("taskDueInput").value = "";
                document.getElementById("taskPriorityInput").value = "medium";
            }
        });
        
        clearCompletedBtn.addEventListener('click', () => clearCompleted());
        
        filterBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.getAttribute('data-filter');
                renderTasks();
                updateStats(); // stats remain same, but good to reflect tasks length same
            });
        });
        
        // modal controls
        closeModalBtn.addEventListener('click', closeModal);
        saveEditBtn.addEventListener('click', saveEdit);
        window.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });
        
        // allow enter key in add title field
        document.getElementById("taskTitleInput").addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addBtn.click();
        });
    }
    
    init();
</script>
</body>
</html>
