<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>TaskForce Pro | Ultimate Task Manager</title>
    <meta name="description" content="Professional task manager with real‑time sync, file attachments, rich‑text, time tracking, calendar export, and offline support.">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3B5C7D">
    
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ics@3.8.1/dist/ics.min.js"></script>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/rrule@2.6.4/dist/es5/rrule.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-container">
    <div class="header">
        <h1><i class="fas fa-bolt"></i> TaskForce <span class="title-badge">ultimate</span></h1>
        <div class="header-actions">
            <button id="focusModeBtn" class="icon-btn" title="Focus mode"><i class="fas fa-eye-slash"></i></button>
            <button id="viewToggleBtn" class="icon-btn" title="Toggle Kanban view"><i class="fas fa-columns"></i></button>
            <button id="helpBtn" class="icon-btn" title="Keyboard shortcuts"><i class="fas fa-question"></i></button>
            <div class="theme-toggle">
                <button class="theme-btn" data-theme="light"><i class="fas fa-sun"></i></button>
                <button class="theme-btn" data-theme="dark"><i class="fas fa-moon"></i></button>
            </div>
        </div>
    </div>
    
    <div class="main-grid">
        <div class="sidebar">
            <div class="card">
                <h3><i class="fas fa-plus"></i> New Task</h3>
                <div class="input-group"><input type="text" id="taskTitle" placeholder="Task title"></div>
                <div class="input-group"><div id="richEditor" style="height:150px;"></div></div>
                <div class="input-group"><input type="datetime-local" id="taskDue"></div>
                <div class="input-group">
                    <select id="taskPriority">
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>
                <div class="input-group"><input type="text" id="taskTags" placeholder="Tags (comma separated)"></div>
                <div class="input-group">
                    <select id="recurringRule">
                        <option value="">No repeat</option>
                        <option value="RRULE:FREQ=DAILY">Daily</option>
                        <option value="RRULE:FREQ=WEEKLY">Weekly</option>
                        <option value="RRULE:FREQ=MONTHLY">Monthly</option>
                        <option value="RRULE:FREQ=YEARLY">Yearly</option>
                    </select>
                </div>
                <div class="input-group">
                    <label><i class="fas fa-bell"></i> Reminder before due:</label>
                    <select id="reminderOffset">
                        <option value="0">None</option>
                        <option value="5">5 minutes</option>
                        <option value="15">15 minutes</option>
                        <option value="30">30 minutes</option>
                        <option value="60">1 hour</option>
                        <option value="120">2 hours</option>
                        <option value="1440">1 day</option>
                        <option value="10080">1 week</option>
                    </select>
                </div>
                <div class="input-group">
                    <label><i class="fas fa-paperclip"></i> Attach files</label>
                    <input type="file" id="taskFiles" multiple>
                    <div id="filePreviewList" style="margin-top:0.5rem; font-size:0.7rem;"></div>
                </div>
                <button id="addBtn"><i class="fas fa-save"></i> Add Task</button>
            </div>
            <div class="card">
                <h3><i class="fas fa-chart-line"></i> Stats</h3>
                <div id="stats"></div>
                <div id="lastSaved"></div>
                <button id="syncBtn" class="secondary-btn"><i class="fas fa-cloud-upload-alt"></i> Force Sync</button>
                <button id="shareListBtn" class="secondary-btn"><i class="fas fa-share-alt"></i> Share List</button>
                <button id="signInBtn" class="secondary-btn"><i class="fab fa-google"></i> Sign in</button>
            </div>
            <div class="card">
                <h3><i class="fas fa-chart-simple"></i> Analytics</h3>
                <canvas id="completionChart" width="200" height="150"></canvas>
                <div id="insights"></div>
                <button id="exportCsvBtn" class="secondary-btn"><i class="fas fa-file-csv"></i> Export CSV</button>
            </div>
            <div class="card">
                <h3><i class="fas fa-calendar-alt"></i> Calendar</h3>
                <div id="miniCalendar"></div>
            </div>
            <div class="card">
                <h3><i class="fas fa-file-export"></i> Data</h3>
                <button id="exportBtn">Export JSON</button>
                <button id="importBtn">Import JSON</button>
                <button id="exportCalendarBtn" class="secondary-btn" style="margin-top:0.5rem;"><i class="fas fa-calendar-plus"></i> Export to Calendar (with reminders)</button>
                <input type="file" id="importFile" style="display:none">
            </div>
            <div class="card">
                <h3><i class="fas fa-clock"></i> Pomodoro</h3>
                <div><span id="timerDisplay">25:00</span> <button id="pomodoroStart">Start</button> <button id="pomodoroStop">Stop</button></div>
            </div>
        </div>
        
        <div class="content">
            <div class="card toolbar">
                <div class="filter-group">
                    <button id="filterAll">All</button>
                    <button id="filterActive">Active</button>
                    <button id="filterCompleted">Completed</button>
                </div>
                <select id="sortBy">
                    <option value="due">Due Date</option>
                    <option value="priority">Priority</option>
                    <option value="created">Created</option>
                </select>
                <input type="text" id="searchTasks" placeholder="Search...">
                <button id="bulkDeleteBtn"><i class="fas fa-trash"></i> Delete Selected</button>
                <button id="bulkCompleteBtn"><i class="fas fa-check-double"></i> Complete Selected</button>
            </div>
            <div id="taskListContainer" class="task-list"></div>
            <div id="kanbanContainer" class="kanban-board" style="display:none;"></div>
        </div>
    </div>
</div>

<!-- Modals -->
<div id="shortcutsModal" class="modal" style="display:none">
    <div class="modal-content"><h3>Keyboard Shortcuts</h3>
        <ul><li><kbd>Ctrl+N</kbd> New task</li><li><kbd>Ctrl+F</kbd> Search</li><li><kbd>Ctrl+Z</kbd> Undo</li><li><kbd>Del</kbd> Delete selected</li><li><kbd>?</kbd> Help</li></ul>
        <button id="closeShortcuts">Close</button>
    </div>
</div>
<div id="shareModal" class="modal" style="display:none">
    <div class="modal-content"><h3>Share Task List</h3>
        <p>Enter email to share:</p>
        <input type="email" id="shareEmail" placeholder="friend@example.com">
        <button id="shareConfirm">Share</button>
        <button id="closeShareModal">Cancel</button>
    </div>
</div>
<div id="editModal" class="modal" style="display:none">
    <div class="modal-content">
        <h3>Edit Task</h3>
        <div class="modal-input-group"><label>Title</label><input id="editTitle" type="text"></div>
        <div class="modal-input-group"><label>Description</label><textarea id="editDesc"></textarea></div>
        <div class="modal-input-group"><label>Due Date</label><input id="editDue" type="datetime-local"></div>
        <div class="modal-input-group"><label>Priority</label><select id="editPriority"><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select></div>
        <div class="modal-input-group"><label>Reminder (minutes before)</label><select id="editReminderOffset">
            <option value="0">None</option><option value="5">5 minutes</option><option value="15">15 minutes</option>
            <option value="30">30 minutes</option><option value="60">1 hour</option><option value="120">2 hours</option>
            <option value="1440">1 day</option><option value="10080">1 week</option>
        </select></div>
        <div class="modal-buttons">
            <button id="closeEditModal">Cancel</button>
            <button id="saveEditBtn">Save</button>
        </div>
    </div>
</div>

<div id="toast" class="toast" style="display:none"></div>
<div aria-live="polite" class="sr-only" id="liveAnnouncer"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
